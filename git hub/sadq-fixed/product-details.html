<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — SADQ</title>
<link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/animations.css">
<style>.page{max-width:920px;margin:auto;padding:32px 20px}.back{color:var(--blue);text-decoration:none}.product{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1fr);gap:24px;margin-top:22px}.media,.details{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card-bg);padding:22px}.media img{width:100%;max-height:460px;object-fit:contain;border-radius:10px}.placeholder{min-height:300px;display:grid;place-items:center;font-size:5rem;background:rgba(37,99,235,.06);border-radius:10px}.price{font-size:1.6rem;font-weight:800;margin:16px 0}.meta{color:var(--text-muted);font-size:.8rem}.description{margin:18px 0;white-space:pre-wrap}.purchase{display:flex;gap:8px;align-items:center;margin-top:20px}.purchase input{width:70px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--card-bg);color:inherit}.state{text-align:center;padding:60px 20px;color:var(--text-muted)}.error{color:#ef4444}@media(max-width:700px){.product{grid-template-columns:1fr}}
</style>
</head>
<body><main class="page"><a class="back" href="/marketplace.html">← Marketplace</a><div id="state" class="state">Loading product...</div><div id="product" class="product hidden"><section class="media" id="media"></section><section class="details"><h1 id="title"></h1><div class="meta" id="category"></div><div class="price" id="price"></div><div class="meta" id="availability"></div><p class="description" id="description"></p><div class="purchase"><input id="quantity" type="number" min="1" value="1"><button id="purchase" class="btn btn--primary">Purchase</button></div><p class="meta" id="message"></p></section></div></main>
<script type="module">
import { supabase, getCurrentUser, esc } from '/js/supabase-client.js?v=20260910';
const id=new URLSearchParams(location.search).get('id'),state=document.getElementById('state');let product=null;
function available(row){return Math.max(0,(Number(row.stock_quantity)||0)-(Number(row.reserved_quantity)||0)-(Number(row.sold_quantity)||0))}
try{if(!id)throw new Error('Missing product id');const{data,error}=await supabase.from('products').select('*').eq('id',id).eq('status','published').single();if(error)throw error;if(!data)throw new Error('Product not found');product=data;const stock=available(product);document.title=`${product.title||'Product'} — SADQ`;document.getElementById('title').textContent=product.title||'Untitled product';document.getElementById('category').textContent=product.category||'Marketplace product';document.getElementById('price').textContent=Number(product.price)===0?'Free':`₹${product.price||0}`;document.getElementById('availability').textContent=stock>0?`${stock} available`:'Out of stock';document.getElementById('description').textContent=product.description||'No description provided.';const image=product.image_url||product.thumbnail_url||product.photo_url;document.getElementById('media').innerHTML=image?`<img src="${esc(image)}" alt="${esc(product.title||'Product')}">`:'<div class="placeholder">🛍️</div>';const button=document.getElementById('purchase');if(stock<=0){button.disabled=true;button.textContent='Out of stock'}else{button.addEventListener('click',async()=>{const quantity=Math.max(1,Number(document.getElementById('quantity').value)||1);if(quantity>stock){document.getElementById('message').textContent='Quantity exceeds available stock.';return}button.disabled=true;button.textContent='Processing...';try{const{data:result,error:purchaseError}=await supabase.rpc('purchase_product',{p_product_id:id,p_quantity:quantity});if(purchaseError)throw purchaseError;if(result?.success===false)throw new Error(result.error||'Purchase was rejected');document.getElementById('message').textContent='Purchase request accepted by the marketplace.'}catch(error){document.getElementById('message').textContent=error.message||'Purchase could not be completed.'}finally{button.disabled=false;button.textContent='Purchase'}})}state.classList.add('hidden');document.getElementById('product').classList.remove('hidden')}catch(error){state.className='state error';state.textContent='Unable to load this product.';console.error('[ProductDetails]',error.message)}
</script></body></html>

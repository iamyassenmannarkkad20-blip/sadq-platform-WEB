<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — SADQ</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a5632">
  <style>
    :root { --p:#8B5CF6; --pl:#7C3AED; --pd:#0f3d20; --bg:#050816; --bg2:#090D1F; --card:#10152A; --text:#F8FAFC; --muted:#94A3B8; --border:rgba(255,255,255,0.08); --danger:#EF4444; --success:#10B981; --gold:#D4AF37; --purple:#8B5CF6; --blue:#3B82F6; --r:14px; --rs:8px; --shadow:0 4px 20px rgba(0,0,0,0.4); --t:0.3s ease; --sw:240px; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg,#050816);color:var(--text,#F8FAFC);line-height:1.6;-webkit-font-smoothing:antialiased}
    .header{position:sticky;top:0;z-index:100;height:64px;background:var(--sadq-primary);display:flex;align-items:center;padding:0 16px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .header__logo{font-size:1.25rem;font-weight:700;color:#fff;text-decoration:none}
    .header__nav{margin-left:auto;display:flex;gap:4px}
    .header__nav a{color:rgba(255,255,255,.85);text-decoration:none;font-size:.8125rem;padding:6px 10px;border-radius:var(--sadq-radius-sm)}
    .header__nav a:hover{background:rgba(255,255,255,.1);color:#fff}
    .container{max-width:760px;margin:0 auto;padding:16px}
    .back-link{color:var(--sadq-primary);text-decoration:none;font-size:.875rem;margin-bottom:16px;display:inline-flex;align-items:center;gap:4px}
    .back-link:hover{text-decoration:underline}
    .post__meta{font-size:.75rem;color:var(--sadq-text-muted);margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .post__category{background:var(--sadq-primary);color:#fff;padding:2px 8px;border-radius:10px;font-size:.6875rem;font-weight:500}
    .post__title{font-size:1.75rem;font-weight:700;line-height:1.3;margin-bottom:12px}
    .post__author{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--sadq-border);margin-bottom:20px}
    .post__author-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--sadq-border)}
    .post__author-name{font-size:.875rem;font-weight:500}
    .post__author-sub{font-size:.75rem;color:var(--sadq-text-muted)}
    .post__featured-img{width:100%;border-radius:var(--sadq-radius);margin-bottom:20px;max-height:400px;object-fit:cover}
    .post__content{font-size:1rem;line-height:1.8;color:var(--text,#F8FAFC)}
    .post__content p{margin-bottom:16px}
    .post__content h2{font-size:1.25rem;font-weight:600;margin:24px 0 12px}
    .post__content img{max-width:100%;border-radius:var(--sadq-radius-sm);margin:12px 0}
    .post__content blockquote{border-left:3px solid var(--sadq-primary);padding:8px 16px;margin:16px 0;color:var(--sadq-text-muted);font-style:italic}
    .post__tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:24px;padding-top:16px;border-top:1px solid var(--sadq-border)}
    .tag{background:#f0f7f0;color:var(--sadq-primary);padding:4px 10px;border-radius:12px;font-size:.75rem;text-decoration:none}
    .post__actions{display:flex;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--sadq-border)}
    .action-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--sadq-border);border-radius:var(--sadq-radius-sm);background:#fff;cursor:pointer;font-size:.8125rem;color:var(--text,#F8FAFC);transition:var(--sadq-transition)}
    .action-btn:hover{border-color:var(--sadq-primary);color:var(--sadq-primary)}
    .action-btn--liked{color:var(--sadq-danger);border-color:var(--sadq-danger)}
    .comments{margin-top:32px}
    .comments__title{font-size:1.125rem;font-weight:600;margin-bottom:16px}
    .comment-form{margin-bottom:20px}
    .comment-form textarea{width:100%;padding:12px;border:1px solid var(--sadq-border);border-radius:var(--sadq-radius-sm);font-size:.875rem;font-family:inherit;resize:vertical;min-height:80px}
    .comment-form textarea:focus{outline:none;border-color:var(--sadq-primary);box-shadow:0 0 0 3px rgba(26,86,50,.1)}
    .btn{padding:10px 20px;border:none;border-radius:var(--sadq-radius-sm);font-size:.875rem;font-weight:500;cursor:pointer;background:var(--sadq-primary);color:#fff;transition:var(--sadq-transition)}
    .btn:hover{background:var(--sadq-primary-light)}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .comment{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--sadq-border)}
    .comment__avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--sadq-border);flex-shrink:0}
    .comment__body{flex:1}
    .comment__author{font-size:.8125rem;font-weight:500}
    .comment__time{font-size:.6875rem;color:var(--sadq-text-muted)}
    .comment__text{font-size:.875rem;margin-top:4px}
    .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--sadq-radius)}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .empty-state{text-align:center;padding:60px 16px;color:var(--sadq-text-muted)}
    .empty-state__icon{font-size:3rem;margin-bottom:12px;opacity:.3}
    .hidden{display:none!important}
    .fade-in{animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:600px){.post__title{font-size:1.375rem}}
  </style>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <header class="header">
    <a href="/" class="header__logo">SADQ</a>
    <nav class="header__nav">
      <a href="/explore.html">Explore</a>
      <a href="/login.html">Login</a>
    </nav>
  </header>

  <div class="container">
    <a href="/explore.html" class="back-link">← Back to Explore</a>

    <div id="loading">
      <div class="skeleton" style="height:24px;width:60%;margin-bottom:12px"></div>
      <div class="skeleton" style="height:200px;margin-bottom:20px"></div>
      <div class="skeleton" style="height:16px;margin-bottom:8px"></div>
      <div class="skeleton" style="height:16px;margin-bottom:8px"></div>
      <div class="skeleton" style="height:16px;width:80%"></div>
    </div>

    <div id="content" class="hidden fade-in"></div>

    <div id="error" class="empty-state hidden">
      <div class="empty-state__icon">📄</div>
      <p>Unable to load this article. Please try again.</p>
      <a href="/explore.html" style="color:var(--sadq-primary);text-decoration:none;font-size:.875rem">Go to Explore</a>
    </div>
  </div>

  <script type="module">
    import { supabase, getCurrentUser } from '/js/supabase-client.js';

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const id = params.get('id');

    let currentUser = null;
    let postData = null;
    let isLiked = false;

    async function init() {
      try {
        const { user } = await getCurrentUser();
        currentUser = user;
      } catch {}

      if (!slug && !id) { showError(); return; }

      try {
        let query = supabase.from('posts')
          .select('*')
          .eq('status', 'published');

        if (slug) query = query.eq('slug', slug).single();
        else query = query.eq('id', id).single();

        const { data, error } = await query;
        if (error) throw error;
        if (!data) { showError(); return; }

        postData = data;
        document.title = `${data.title} — SADQ`;
        renderPost(data);

        if (currentUser) { await checkLike(); await loadComments(); }

      } catch (err) {
        console.error('[PostDetails] Error:', err.message);
        showError();
      }
    }

    function renderPost(p) {
      const author = p.profiles || {};
      const tags = Array.isArray(p.tags) ? p.tags : (p.tags ? JSON.parse(p.tags) : []);

      document.getElementById('content').innerHTML = `
        <div class="post__meta">
          ${p.post_kind ? `<span class="post__category">${p.post_kind}</span>` : ''}
          <span>${new Date(p.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
          ${p.views ? `<span>· ${p.views} views</span>` : ''}
        </div>
        <h1 class="post__title">${p.title}</h1>
        <div class="post__author">
          <img class="post__author-avatar" src="${author.profile_photo_url || '/assets/icons/sadq-icon.svg'}" alt="" onerror="this.src='/assets/icons/sadq-icon.svg'">
          <div>
            <div class="post__author-name">${author.full_name || 'Anonymous'}</div>
            <div class="post__author-sub">@${author.username || ''}</div>
          </div>
        </div>
        ${p.featured_image_url ? `<img class="post__featured-img" src="${p.featured_image_url}" alt="${p.title}">` : ''}
        <div class="post__content">${p.content || ''}</div>
        ${tags.length ? `<div class="post__tags">${tags.map(t => `<span class="tag">#${t}</span>`).join('')}</div>` : ''}
        <div class="post__actions">
          <button class="action-btn" id="like-btn" onclick="window.toggleLike()">
            <span id="like-icon">🤍</span> <span id="like-count">0</span>
          </button>
          <button class="action-btn" onclick="document.getElementById('comment-input').focus()">💬 Comment</button>
          <button class="action-btn" onclick="window.sharePost()">🔗 Share</button>
        </div>
        <div class="comments">
          <div class="comments__title">Comments</div>
          ${currentUser ? `
            <form class="comment-form" onsubmit="return false">
              <textarea id="comment-input" placeholder="Write a comment..." required></textarea>
              <button class="btn" id="post-comment-btn" onclick="window.postComment()" style="margin-top:8px">Post Comment</button>
            </form>
          ` : `<p style="font-size:.8125rem;color:var(--sadq-text-muted);margin-bottom:16px"><a href="/login.html" style="color:var(--sadq-primary)">Login</a> to comment.</p>`}
          <div id="comments-list"></div>
        </div>
      `;
      document.getElementById('content').classList.remove('hidden');
      document.getElementById('loading').classList.add('hidden');
    }

    async function checkLike() {
      if (!currentUser || !postData) return;
      try {
        const { data } = await supabase.from('post_likes')
          .select('id').eq('post_id', postData.id).eq('user_id', currentUser.id).maybeSingle();
        isLiked = !!data;
        updateLikeUI();
      } catch {}
      try {
        const { count } = await supabase.from('post_likes')
          .select('id', { count: 'exact', head: true }).eq('post_id', postData.id);
        document.getElementById('like-count').textContent = count || 0;
      } catch {}
    }

    function updateLikeUI() {
      const icon = document.getElementById('like-icon');
      const btn = document.getElementById('like-btn');
      if (icon && btn) {
        icon.textContent = isLiked ? '❤️' : '🤍';
        btn.classList.toggle('action-btn--liked', isLiked);
      }
    }

    window.toggleLike = async function() {
      if (!currentUser) { window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search); return; }
      try {
        if (isLiked) {
          await supabase.from('post_likes').delete().eq('post_id', postData.id).eq('user_id', currentUser.id);
          isLiked = false;
        } else {
          await supabase.from('post_likes').insert({ post_id: postData.id, user_id: currentUser.id });
          isLiked = true;
        }
        updateLikeUI();
        await checkLike();
      } catch (err) { console.error('[Like] Error:', err.message); }
    };

    window.sharePost = function() {
      if (navigator.share) {
        navigator.share({ title: postData.title, url: window.location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard!');
      }
    };

    async function loadComments() {
      try {
        const { data, error } = await supabase.from('post_comments')
          .select('id, content, created_at, user_id, profiles!post_comments_user_id_fkey(full_name, username, profile_photo_url)')
          .eq('post_id', postData.id)
          .order('created_at', { ascending: false });

        if (error) throw error;

        const list = document.getElementById('comments-list');
        if (!data || data.length === 0) {
          list.innerHTML = '<p style="font-size:.8125rem;color:var(--sadq-text-muted);padding:8px 0">No comments yet.</p>';
          return;
        }

        list.innerHTML = data.map(c => {
          const author = c.profiles || {};
          return `
            <div class="comment">
              <img class="comment__avatar" src="${author.profile_photo_url || '/assets/icons/sadq-icon.svg'}" alt="" onerror="this.src='/assets/icons/sadq-icon.svg'">
              <div class="comment__body">
                <div class="comment__author">${author.full_name || 'Anonymous'}</div>
                <div class="comment__time">${new Date(c.created_at).toLocaleString('en-IN')}</div>
                <div class="comment__text">${c.content}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('[Comments] Error:', err.message);
      }
    }

    window.postComment = async function() {
      const input = document.getElementById('comment-input');
      const btn = document.getElementById('post-comment-btn');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      btn.disabled = true; btn.textContent = 'Posting...';
      try {
        const { error } = await supabase.from('post_comments')
          .insert({ post_id: postData.id, user_id: currentUser.id, content: text });
        if (error) throw error;
        input.value = '';
        await loadComments();
      } catch (err) {
        console.error('[PostComment] Error:', err.message);
        alert('Unable to post comment. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Post Comment';
      }
    };

    function showError() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }

    init();

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
  <script src="/js/smooth-scroll.js"></script>
  <script src="/js/interactions.js"></script>
  <script src="/js/page-transition.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — SADQ</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a5632">
  <style>
    :root { --p:#8B5CF6; --pl:#7C3AED; --pd:#0f3d20; --bg:#050816; --bg2:#090D1F; --card:#10152A; --text:#F8FAFC; --muted:#94A3B8; --border:rgba(255,255,255,0.08); --danger:#EF4444; --success:#10B981; --gold:#D4AF37; --purple:#8B5CF6; --blue:#3B82F6; --r:14px; --rs:8px; --shadow:0 4px 20px rgba(0,0,0,0.4); --t:0.3s ease; --sw:240px; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg,#050816);color:var(--text,#F8FAFC);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
    .error-card{text-align:center;max-width:400px}
    .error-card__code{font-size:5rem;font-weight:800;color:var(--sadq-primary);line-height:1;margin-bottom:12px}
    .error-card__title{font-size:1.25rem;font-weight:600;margin-bottom:8px}
    .error-card__text{font-size:.875rem;color:var(--sadq-text-muted);margin-bottom:24px}
    .btn{display:inline-block;padding:12px 28px;background:var(--sadq-primary);color:#fff;text-decoration:none;border-radius:var(--sadq-radius);font-size:.9375rem;font-weight:600;transition:.3s}
    .btn:hover{background:var(--sadq-primary-light)}
    .logo{font-size:1.5rem;font-weight:700;color:var(--sadq-primary);text-decoration:none;margin-bottom:24px;display:inline-block}
  </style>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <div class="error-card">
    <a href="/" class="logo">SADQ</a>
    <div class="error-card__code">404</div>
    <h1 class="error-card__title">Page Not Found</h1>
    <p class="error-card__text">The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">Go Home</a>
  </div>
  <script src="/js/smooth-scroll.js"></script>
  <script src="/js/interactions.js"></script>
  <script src="/js/page-transition.js"></script>
</body>
</html>

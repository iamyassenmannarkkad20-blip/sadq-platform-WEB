<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events — SADQ</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a5632">
  <style>
    :root { --p:#8B5CF6; --pl:#7C3AED; --pd:#0f3d20; --bg:#050816; --bg2:#090D1F; --card:#10152A; --text:#F8FAFC; --muted:#94A3B8; --border:rgba(255,255,255,0.08); --danger:#EF4444; --success:#10B981; --gold:#D4AF37; --purple:#8B5CF6; --blue:#3B82F6; --r:14px; --rs:8px; --shadow:0 4px 20px rgba(0,0,0,0.4); --t:0.3s ease; --sw:240px; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg,#050816);color:var(--text,#F8FAFC);line-height:1.6;-webkit-font-smoothing:antialiased}
    .header{position:sticky;top:0;z-index:100;height:64px;background:var(--sadq-primary);display:flex;align-items:center;padding:0 16px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .header__logo{font-size:1.25rem;font-weight:700;color:#fff;text-decoration:none}
    .header__nav{margin-left:auto;display:flex;gap:4px}
    .header__nav a{color:rgba(255,255,255,.85);text-decoration:none;font-size:.8125rem;padding:6px 10px;border-radius:var(--sadq-radius-sm)}
    .header__nav a:hover{background:rgba(255,255,255,.1);color:#fff}
    .container{max-width:900px;margin:0 auto;padding:16px}
    .hero{background:linear-gradient(135deg,var(--sadq-primary),var(--sadq-primary-light));border-radius:var(--sadq-radius);padding:24px;margin-bottom:20px;color:#fff}
    .hero__title{font-size:1.5rem;font-weight:700;margin-bottom:4px}
    .hero__sub{font-size:.875rem;opacity:.85;margin-bottom:16px}
    .hero__search{width:100%;padding:12px 16px;border:none;border-radius:var(--sadq-radius-sm);font-size:.9375rem}
    .filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .filter-select{padding:8px 12px;border:1px solid var(--sadq-border);border-radius:var(--sadq-radius-sm);font-size:.8125rem;background:#fff}
    .tabs{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
    .tab{padding:8px 14px;border:1px solid var(--sadq-border);border-radius:20px;background:#fff;cursor:pointer;font-size:.8125rem;font-weight:500;white-space:nowrap;transition:var(--sadq-transition)}
    .tab--active{background:var(--sadq-primary);color:#fff;border-color:var(--sadq-primary)}
    .events-list{display:flex;flex-direction:column;gap:12px}
    .event-card{background:var(--sadq-card-bg);border-radius:var(--sadq-radius);overflow:hidden;box-shadow:var(--sadq-shadow);transition:var(--sadq-transition);text-decoration:none;color:var(--text,#F8FAFC);display:flex}
    .event-card:hover{box-shadow:var(--sadq-shadow-hover);transform:translateY(-2px)}
    .event-card__date{background:var(--sadq-primary);color:#fff;padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;text-align:center}
    .event-card__date-day{font-size:1.5rem;font-weight:700;line-height:1}
    .event-card__date-month{font-size:.6875rem;text-transform:uppercase;margin-top:2px}
    .event-card__body{padding:14px;flex:1;min-width:0}
    .event-card__title{font-size:.9375rem;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .event-card__meta{font-size:.75rem;color:var(--sadq-text-muted);display:flex;gap:10px;flex-wrap:wrap}
    .event-card__meta span{display:flex;align-items:center;gap:4px}
    .event-card__thumb{width:100px;height:100px;object-fit:cover;flex-shrink:0}
    .badge{font-size:.6875rem;padding:2px 8px;border-radius:10px;font-weight:500;display:inline-block}
    .badge--online{background:#e3f2fd;color:#1565c0}
    .badge--offline{background:#fff3e0;color:#e65100}
    .empty-state{text-align:center;padding:60px 16px;color:var(--sadq-text-muted)}
    .empty-state__icon{font-size:3rem;margin-bottom:12px;opacity:.3}
    .empty-state__text{font-size:1rem}
    .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--sadq-radius)}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .fade-in{animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .hidden{display:none!important}
    .load-more{text-align:center;padding:20px}
    .btn{padding:10px 20px;border:none;border-radius:var(--sadq-radius-sm);font-size:.875rem;font-weight:500;cursor:pointer;background:var(--sadq-primary);color:#fff}
    .btn:hover{background:var(--sadq-primary-light)}
    @media(max-width:600px){.event-card__thumb{display:none}.event-card__date{min-width:52px;padding:8px}.event-card__date-day{font-size:1.125rem}}
  </style>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <header class="header">
    <a href="/" class="header__logo">SADQ</a>
    <nav class="header__nav">
      <a href="/explore.html">Explore</a>
      <a href="/login.html">Login</a>
    </nav>
  </header>
  <div class="container">
    <div class="hero">
      <div class="hero__title">📅 Events</div>
      <div class="hero__sub">Workshops, gatherings, and community events</div>
      <input type="text" class="hero__search" id="search-input" placeholder="Search events...">
    </div>
    <div class="tabs" id="tabs">
      <div class="tab tab--active" data-filter="upcoming">Upcoming</div>
      <div class="tab" data-filter="past">Past Events</div>
      <div class="tab" data-filter="all">All Events</div>
    </div>
    <div id="loading">
      <div class="skeleton" style="height:100px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:100px;margin-bottom:12px"></div>
      <div class="skeleton" style="height:100px"></div>
    </div>
    <div id="results" class="events-list hidden"></div>
    <div id="empty" class="empty-state hidden">
      <div class="empty-state__icon">📅</div>
      <div class="empty-state__text">No events found.</div>
    </div>
    <div class="load-more hidden" id="load-more-wrap">
      <button class="btn" id="load-more-btn">Load More</button>
    </div>
  </div>
  <script type="module">
    import { supabase } from '/js/supabase-client.js';
    let searchTerm = '';
    let searchTimeout = null;
    let activeFilter = 'upcoming';
    let page = 0;
    const pageSize = 10;

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchTerm = e.target.value.trim();
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => { page = 0; loadEvents(); }, 400);
    });
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab--active'));
        tab.classList.add('tab--active');
        activeFilter = tab.dataset.filter;
        page = 0;
        loadEvents();
      });
    });
    document.getElementById('load-more-btn').addEventListener('click', () => { page++; loadEvents(true); });

    function showLoading() { document.getElementById('loading').classList.remove('hidden'); document.getElementById('results').classList.add('hidden'); document.getElementById('empty').classList.add('hidden'); document.getElementById('load-more-wrap').classList.add('hidden'); }
    function showEmpty() { document.getElementById('loading').classList.add('hidden'); document.getElementById('results').classList.add('hidden'); document.getElementById('empty').classList.remove('hidden'); document.getElementById('load-more-wrap').classList.add('hidden'); }
    function showResults() { document.getElementById('loading').classList.add('hidden'); document.getElementById('results').classList.remove('hidden'); document.getElementById('empty').classList.add('hidden'); }

    async function loadEvents(append = false) {
      if (!append) showLoading();
      try {
        const now = new Date().toISOString();
        let query = supabase.from('events')
          .select('*')
          .eq('approval_status', 'approved')
          .order('event_date', { ascending: activeFilter === 'past' ? false : true })
          .range(page * pageSize, (page + 1) * pageSize - 1);

        if (activeFilter === 'upcoming') query = query.gte('event_date', now);
        else if (activeFilter === 'past') query = query.lt('event_date', now);
        if (searchTerm) query = query.or(`title.ilike.%${searchTerm}%,location.ilike.%${searchTerm}%`);

        const { data, error } = await query;
        if (error) throw error;
        if (!append && (!data || data.length === 0)) { showEmpty(); return; }

        const container = document.getElementById('results');
        const html = (data || []).map(e => {
          const d = new Date(e.event_date || e.start_at);
          return `
            <a href="/event-details.html?id=${e.id}" class="event-card fade-in">
              <div class="event-card__date">
                <div class="event-card__date-day">${d.getDate()}</div>
                <div class="event-card__date-month">${d.toLocaleString('en-IN',{month:'short'})}</div>
              </div>
              <div class="event-card__body">
                <div class="event-card__title">${e.title}</div>
                <div class="event-card__meta">
                  <span>🕐 ${d.toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
                  ${e.location ? `<span>📍 ${e.location}</span>` : ''}
                  ${e.is_online ? '<span class="badge badge--online">Online</span>' : '<span class="badge badge--offline">On-site</span>'}
                </div>
              </div>
              ${e.featured_image_url ? `<img class="event-card__thumb" src="${e.featured_image_url}" alt="">` : ''}
            </a>
          `;
        }).join('');

        if (append) container.insertAdjacentHTML('beforeend', html);
        else container.innerHTML = html;

        showResults();
        document.getElementById('load-more-wrap').classList.toggle('hidden', (data || []).length < pageSize);
      } catch (err) {
        console.error('[Events] Error:', err.message);
        showEmpty();
      }
    }

    loadEvents();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
  <script src="/js/smooth-scroll.js"></script>
  <script src="/js/interactions.js"></script>
  <script src="/js/page-transition.js"></script>
</body>
</html>

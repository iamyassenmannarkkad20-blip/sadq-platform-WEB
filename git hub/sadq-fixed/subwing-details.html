<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sub-Wing — SADQ</title>
<link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/animations.css">
<style>.page{max-width:900px;margin:auto;padding:32px 20px}.back{display:inline-block;margin-bottom:20px;color:var(--blue);text-decoration:none}.hero,.section{padding:24px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--card-bg);margin-bottom:16px}.hero h1{margin-bottom:8px}.meta{color:var(--text-muted);font-size:.82rem}.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.person{padding:12px;border:1px solid var(--border);border-radius:8px}.person small{display:block;color:var(--text-muted)}.content{padding:14px 0;border-bottom:1px solid var(--border)}.content:last-child{border-bottom:0}.content h3{margin:0 0 5px;font-size:.95rem}.content p{margin:0;color:var(--text-muted);font-size:.82rem}.state{text-align:center;padding:50px 20px;color:var(--text-muted)}.error{color:#ef4444}@media(max-width:600px){.people{grid-template-columns:1fr}}</style>
</head>
<body><main class="page"><a class="back" href="/subwings.html">← All Sub-Wings</a><div id="state" class="state">Loading sub-wing...</div><div id="content" class="hidden"><section class="hero"><h1 id="name"></h1><div class="meta" id="type"></div><p id="description"></p><div class="people"><div class="person"><small>Chairman</small><strong id="chairman">—</strong></div><div class="person"><small>Convener</small><strong id="convener">—</strong></div></div></section><section class="section"><h2>Published Activities and Content</h2><div id="items"></div></section></div></main>
<script type="module">
import { supabase, esc } from '/js/supabase-client.js?v=20260910';
const id=new URLSearchParams(location.search).get('id'),state=document.getElementById('state');
try{if(!id)throw new Error('Missing sub-wing id');const{data:wing,error:wingError}=await supabase.from('sub_wings').select('id,name,wing_type,description,chairman_name,convener_name').eq('id',id).eq('account_status','active').single();if(wingError)throw wingError;const{data:items,error:contentError}=await supabase.from('sub_wing_content').select('title,description,content_type,event_date,created_at').eq('sub_wing_id',id).eq('status','published').order('created_at',{ascending:false});if(contentError)throw contentError;document.title=`${wing.name} — SADQ`;document.getElementById('name').textContent=wing.name;document.getElementById('type').textContent=wing.wing_type==='sub_wing'?'Sub-Wing':'Class Organisation';document.getElementById('description').textContent=wing.description||'';document.getElementById('chairman').textContent=wing.chairman_name||'Not listed';document.getElementById('convener').textContent=wing.convener_name||'Not listed';document.getElementById('items').innerHTML=items?.length?items.map(item=>`<article class="content"><h3>${esc(item.title||'Untitled')}</h3><p>${esc(item.description||'')}</p><p>${esc(item.content_type||'activity')} · ${item.event_date?new Date(item.event_date).toLocaleDateString('en-IN'):new Date(item.created_at).toLocaleDateString('en-IN')}</p></article>`).join(''):'<div class="state">No published content yet.</div>';state.classList.add('hidden');document.getElementById('content').classList.remove('hidden')}catch(error){state.className='state error';state.textContent='Unable to load this sub-wing.';if(error.message!=='Missing sub-wing id')console.error('[SubWingDetails]',error.message)}
</script></body></html>

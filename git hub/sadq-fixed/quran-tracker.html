<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quran Progress — SADQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/animations.css">
<style>
.dash-header{background:var(--glass-bg);backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--border);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.dash-header h1{font-size:1.5rem;font-weight:800}
.dash-header p{font-size:0.8rem;color:var(--text-muted);margin-top:2px}
.quran-container{max-width:900px;margin:0 auto;padding:24px 20px}
.progress-hero{background:var(--glass-bg);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius-xl);padding:32px;text-align:center;margin-bottom:24px;position:relative;overflow:hidden}
.progress-hero::before{content:'';position:absolute;top:-50%;left:-20%;width:300px;height:300px;background:radial-gradient(circle,rgba(16,185,129,0.08) 0%,transparent 70%);border-radius:50%}
.progress-ring{width:140px;height:140px;margin:0 auto 16px;position:relative}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring__bg{fill:none;stroke:rgba(255,255,255,0.06);stroke-width:10}
.progress-ring__fill{fill:none;stroke:url(#gradient);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s ease}
.progress-ring__text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.progress-ring__percent{font-size:2rem;font-weight:800;line-height:1}
.progress-ring__label{font-size:0.75rem;color:var(--text-muted)}
.quran-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.quran-stat{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.quran-stat__value{font-size:1.5rem;font-weight:700}
.quran-stat__label{font-size:0.75rem;color:var(--text-muted);margin-top:4px}
.juz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-bottom:24px}
.juz-item{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:var(--t);border:2px solid var(--border);position:relative;overflow:hidden}
.juz-item:hover{transform:scale(1.05);border-color:var(--border-l)}
.juz-item__num{font-size:1.125rem;font-weight:700}
.juz-item__label{font-size:0.5rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px}
.juz-not-started{background:rgba(255,255,255,0.02)}
.juz-in-progress{background:rgba(245,158,11,0.08);border-color:rgba(245,158,11,0.2)}
.juz-in-progress .juz-item__num{color:var(--warning)}
.juz-completed{background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.3)}
.juz-completed .juz-item__num{color:var(--emerald)}
.juz-completed::after{content:'✓';position:absolute;top:4px;right:6px;font-size:0.625rem;color:var(--emerald)}
.section-title{font-size:1rem;font-weight:600;margin-bottom:12px;color:var(--text)}
.khatm-list{display:flex;flex-direction:column;gap:8px}
.khatm-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm)}
.khatm-item__icon{font-size:1.5rem}
.khatm-item__body{flex:1}
.khatm-item__title{font-size:0.875rem;font-weight:500}
.khatm-item__meta{font-size:0.75rem;color:var(--text-muted)}
</style>
</head>
<body>
<div class="dash-header">
  <div>
    <h1>📖 Quran Progress</h1>
    <p id="student-name">Loading...</p>
  </div>
  <a href="/dashboard.html" style="color:var(--text-muted);text-decoration:none;font-size:0.8125rem">← Dashboard</a>
</div>

<div class="quran-container">
  <div class="progress-hero">
    <div class="progress-ring">
      <svg width="140" height="140">
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#34D399"/>
          </linearGradient>
        </defs>
        <circle class="progress-ring__bg" cx="70" cy="70" r="60"/>
        <circle class="progress-ring__fill" id="ring-fill" cx="70" cy="70" r="60" stroke-dasharray="377" stroke-dashoffset="377"/>
      </svg>
      <div class="progress-ring__text">
        <div class="progress-ring__percent" id="progress-percent">0%</div>
        <div class="progress-ring__label">Complete</div>
      </div>
    </div>
    <p style="color:var(--text-muted);font-size:0.875rem">Track your journey through the Holy Quran — 30 Juz</p>
  </div>

  <div class="quran-stats">
    <div class="quran-stat"><div class="quran-stat__value" id="stat-completed" style="color:var(--emerald)">0</div><div class="quran-stat__label">Juz Completed</div></div>
    <div class="quran-stat"><div class="quran-stat__value" id="stat-progress" style="color:var(--warning)">0</div><div class="quran-stat__label">In Progress</div></div>
    <div class="quran-stat"><div class="quran-stat__value" id="stat-remaining">30</div><div class="quran-stat__label">Not Started</div></div>
    <div class="quran-stat"><div class="quran-stat__value" id="stat-khatm" style="color:var(--gold,#F9A825)">0</div><div class="quran-stat__label">Khatm Count</div></div>
  </div>

  <h3 class="section-title">30 Juz Progress</h3>
  <div class="juz-grid" id="juz-grid"></div>

  <h3 class="section-title" style="margin-top:24px">Khatm Records</h3>
  <div id="khatm-list">
    <div class="skeleton" style="height:60px;border-radius:8px"></div>
  </div>
</div>

<div class="modal-overlay" id="juzModal">
  <div class="modal" style="max-width:400px">
    <div class="modal__header">
      <h2 class="modal__title" id="juz-modal-title">Juz 1</h2>
      <button class="modal__close" onclick="closeModal('juzModal')">&times;</button>
    </div>
    <div id="juz-modal-body"></div>
  </div>
</div>

<script type="module">
import{supabase,requireAuth} from '/js/supabase-client.js'
(async()=>{
let auth
try{auth=await requireAuth()}catch(e){return}
const{user,profile}=auth
document.getElementById('student-name').textContent='Welcome, '+(profile.full_name||'Student')

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

let juzProgress={}

async function loadQuranData(){
  const{data,error}=await supabase.from('quran_juz_progress').select('*').eq('student_id',user.id)
  if(error){console.error(error);return}
  
  juzProgress={}
  ;(data||[]).forEach(j=>{juzProgress[j.juz_number]=j})
  
  renderJuzGrid()
  updateStats()
  loadKhatmRecords()
}

function renderJuzGrid(){
  const grid=document.getElementById('juz-grid')
  let html=''
  for(let i=1;i<=30;i++){
    const juz=juzProgress[i]
    const status=juz?juz.status:'not_started'
    const statusClass=`juz-${status.replace('_','-')}`
    const statusLabel=status==='not_started'?'Not Started':status==='in_progress'?'Reading':'Done'
    html+=`<div class="juz-item ${statusClass}" onclick="openJuz(${i})">
      <div class="juz-item__num">${i}</div>
      <div class="juz-item__label">${statusLabel}</div>
    </div>`
  }
  grid.innerHTML=html
}

async function updateStats(){
  const{data}=await supabase.rpc('get_quran_stats')
  if(data){
    const completed=data.completed_juz||0
    const inProgress=data.in_progress_juz||0
    const remaining=data.not_started_juz||30
    const khatm=data.khatm_count||0
    const pct=data.progress_percentage||0
    
    document.getElementById('stat-completed').textContent=completed
    document.getElementById('stat-progress').textContent=inProgress
    document.getElementById('stat-remaining').textContent=remaining
    document.getElementById('stat-khatm').textContent=khatm
    document.getElementById('progress-percent').textContent=pct+'%'
    
    const circumference=2*Math.PI*60
    const offset=circumference-(pct/100)*circumference
    document.getElementById('ring-fill').style.strokeDashoffset=offset
  }
}

window.openJuz=function(juzNum){
  const juz=juzProgress[juzNum]
  const status=juz?juz.status:'not_started'
  document.getElementById('juz-modal-title').textContent='Juz '+juzNum
  
  document.getElementById('juz-modal-body').innerHTML=`
    <div style="margin-bottom:16px">
      <div style="font-size:0.875rem;color:var(--text-muted);margin-bottom:8px">Current Status:</div>
      <div style="font-size:1rem;font-weight:600;color:${status==='completed'?'var(--emerald)':status==='in_progress'?'var(--warning)':'var(--text-muted)'}">
        ${status==='completed'?'✅ Completed':status==='in_progress'?'📖 In Progress':'⭕ Not Started'}
      </div>
    </div>
    ${juz&&juz.completed_at?`<div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:16px">Completed on ${new Date(juz.completed_at).toLocaleDateString()}</div>`:''}
    ${juz&&juz.reading_notes?`<div style="background:rgba(255,255,255,0.04);padding:12px;border-radius:8px;margin-bottom:16px;font-size:0.8125rem"><strong>Notes:</strong><br>${esc(juz.reading_notes)}</div>`:''}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${status!=='in_progress'?`<button class="btn btn--ghost" style="flex:1;min-width:100px" onclick="updateJuz(${juzNum},'in_progress')">Start Reading</button>`:''}
      ${status!=='completed'?`<button class="btn btn--primary" style="flex:1;min-width:100px" onclick="updateJuz(${juzNum},'completed')">Mark Complete</button>`:''}
      ${status!=='not_started'?`<button class="btn btn--ghost" onclick="updateJuz(${juzNum},'not_started')">Reset</button>`:''}
    </div>
    <div style="margin-top:16px">
      <label class="form-label">Reading Notes</label>
      <textarea class="form-textarea" id="juz-notes" placeholder="Add your reading notes...">${juz?esc(juz.reading_notes||''):''}</textarea>
      <button class="btn btn--ghost" style="margin-top:8px;width:100%" onclick="saveNotes(${juzNum})">Save Notes</button>
    </div>
  `
  openModal('juzModal')
}

window.updateJuz=async function(juzNum,newStatus){
  const{data,error}=await supabase.rpc('update_quran_progress',{
    p_juz_number:juzNum,
    p_status:newStatus,
    p_notes:null
  })
  
  if(error){showToast('Error: '+error.message,'error');return}
  
  showToast(`Juz ${juzNum} ${newStatus==='completed'?'completed!':newStatus==='in_progress'?'started':'reset'}`,'success')
  closeModal('juzModal')
  
  if(newStatus==='completed'){
    showToast('Masha Allah! Juz '+juzNum+' complete!','success')
  }
  
  loadQuranData()
}

window.saveNotes=async function(juzNum){
  const notes=document.getElementById('juz-notes').value.trim()
  const juz=juzProgress[juzNum]
  const status=juz?juz.status:'not_started'
  
  const{error}=await supabase.rpc('update_quran_progress',{
    p_juz_number:juzNum,
    p_status:status,
    p_notes:notes
  })
  
  if(error){showToast('Error saving notes','error');return}
  showToast('Notes saved!','success')
  loadQuranData()
}

async function loadKhatmRecords(){
  const list=document.getElementById('khatm-list')
  const{data,error}=await supabase.from('quran_khatm').select('*').eq('student_id',user.id).order('completed_at',{ascending:false})
  
  if(error){list.innerHTML='<div class="empty-mini"><div class="empty-mini__text">Error loading records</div></div>';return}
  if(!data||!data.length){
    list.innerHTML='<div class="empty-state"><div class="empty-state__icon">📖</div><div class="empty-state__text">No Khatm records yet</div><div class="empty-state__sub">Complete all 30 Juz to record your first Khatm!</div></div>'
    return
  }
  
  list.innerHTML=data.map(k=>`
    <div class="khatm-item">
      <div class="khatm-item__icon">${k.verification_status==='verified'?'✅':k.verification_status==='rejected'?'❌':'⏳'}</div>
      <div class="khatm-item__body">
        <div class="khatm-item__title">Quran Khatm</div>
        <div class="khatm-item__meta">Completed: ${new Date(k.completed_at).toLocaleDateString()} · ${k.verification_status}</div>
      </div>
    </div>
  `).join('')
}

loadQuranData()
})();
</script>
<script src="/js/sadq-common.js"></script>
<script src="/js/interactions.js"></script>
</body>
</html>

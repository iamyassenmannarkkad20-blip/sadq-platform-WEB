<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SADQ</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/animations.css">
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--glass-bg);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);overflow:hidden;width:100%;max-width:440px}
.login-header{background:var(--gradient-primary);padding:36px 24px 28px;text-align:center;position:relative;overflow:hidden}
.login-header::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);border-radius:50%}
.login-logo{font-size:2.5rem;font-weight:900;color:#fff;position:relative}
.login-logo span{color:var(--gold)}
.login-header p{color:rgba(255,255,255,0.8);font-size:0.8125rem;margin-top:4px;position:relative}
.login-body{padding:28px 24px}
.tabs{display:flex;gap:8px;margin-bottom:24px;background:var(--bg-card);border-radius:var(--radius-sm);padding:4px}
.tab-btn{flex:1;padding:10px;border:none;background:transparent;border-radius:6px;font-size:0.875rem;font-weight:600;cursor:pointer;transition:var(--t-fast);color:var(--text-muted)}
.tab-btn.active{background:var(--gradient-cta);color:#fff;box-shadow:0 2px 10px rgba(37,99,235,0.3)}
.error-msg{background:rgba(239,68,68,0.1);color:#EF4444;padding:10px 14px;border-radius:var(--radius-sm);font-size:0.8125rem;margin-bottom:16px;display:none;border:1px solid rgba(239,68,68,0.2)}
.info-banner{background:rgba(59,130,246,0.1);color:var(--blue);padding:10px 14px;border-radius:var(--radius-sm);font-size:0.75rem;margin-bottom:16px;display:none;border:1px solid rgba(59,130,246,0.2)}
.subwing-link{text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);font-size:0.8125rem}
.subwing-link a{color:var(--gold);font-weight:600}
.links{text-align:center;margin-top:16px;font-size:0.8125rem}
.links a{color:var(--blue)}
</style>
</head>
<body>
<div class="login-wrap">
<div class="login-card load-stagger">
<div class="login-header">
<div class="login-logo">SAD<span>Q</span></div>
<p>Students Association of Darul Quran</p>
</div>
<div class="login-body">
<div class="tabs">
<button class="tab-btn active" data-tab="student" onclick="switchTab('student')">🎓 Student</button>
<button class="tab-btn" data-tab="teacher" onclick="switchTab('teacher')">👨‍🏫 Teacher</button>
</div>
<div class="info-banner" id="login-disabled-banner">⚠️ Student login is currently disabled.</div>
<div class="error-msg" id="error-msg"></div>
<div id="student-panel">
<div class="form-group"><label class="form-label">Email</label><input class="form-input" id="student-email" placeholder="you@example.com"></div>
<div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="student-password" placeholder="••••••••"></div>
<button class="btn btn-primary" style="width:100%" id="student-login-btn" onclick="loginStudent()">Login as Student</button>
<div class="links"><a href="/register.html">New student? Register here</a> · <a href="/reset-password.html">Forgot password?</a></div>
</div>
<div id="teacher-panel" style="display:none">
<div class="form-group"><label class="form-label">Username</label><input class="form-input" id="teacher-username" placeholder="Enter username"></div>
<div class="form-group"><label class="form-label">Password</label><input class="form-input" type="password" id="teacher-password" placeholder="••••••••"></div>
<button class="btn btn-primary" style="width:100%" id="teacher-login-btn" onclick="loginTeacher()">Login as Teacher</button>
<div class="links" style="color:var(--text-muted)">Teacher account created by admin.</div>
</div>
<div class="subwing-link"><a href="/subwing-login.html">🏛️ Sub-Wing Login →</a></div>
</div>
</div>
</div>
<script type="module">
import{supabase} from '/js/supabase-client.js'
supabase.auth.getSession().then(async({data:{session}})=>{if(!session?.user)return;const{data:profile}=await supabase.from('profiles').select('account_status,role').eq('id',session.user.id).single();if(profile?.account_status==='active'){window.location.href=['admin','super_admin'].includes(profile.role)?'/admin-dashboard.html':'/dashboard.html'}else{await supabase.auth.signOut()}}).catch(()=>{})
async function checkLoginSettings(){try{const{data}=await supabase.from('login_settings').select('*').eq('id',1).single()
if(data){if(!data.student_login_enabled){document.getElementById('login-disabled-banner').style.display='block';document.getElementById('student-login-btn').disabled=true}
if(data.teacher_login_enabled===false){document.getElementById('teacher-login-btn').disabled=true}
if(data.maintenance_mode){document.getElementById('error-msg').textContent='⚠️ Platform under maintenance.';document.getElementById('error-msg').style.display='block';document.getElementById('student-login-btn').disabled=true;document.getElementById('teacher-login-btn').disabled=true}}}catch(e){}}
checkLoginSettings()
window.loginStudent=async()=>{const email=document.getElementById('student-email').value.trim(),password=document.getElementById('student-password').value,e=document.getElementById('error-msg'),btn=document.getElementById('student-login-btn')
if(!email||!password){e.textContent='Enter email and password';e.style.display='block';return}
btn.disabled=true;btn.textContent='Logging in...';e.style.display='none'
try{const{data,error}=await supabase.auth.signInWithPassword({email,password})
if(error)throw error
const{data:profile}=await supabase.from('profiles').select('account_status,role').eq('id',data.user.id).single()
if(profile){if(profile.account_status==='pending'){e.textContent='⏳ Registration pending admin approval.';e.style.display='block';await supabase.auth.signOut();btn.disabled=false;btn.textContent='Login as Student';return}
if(['suspended','disabled'].includes(profile.account_status)){e.textContent='🚫 Account '+profile.account_status+'. Contact admin.';e.style.display='block';await supabase.auth.signOut();btn.disabled=false;btn.textContent='Login as Student';return}
if(['suspended','disabled','banned'].includes(profile.account_status)){e.textContent='🚫 Account '+profile.account_status+'. Contact admin.';e.style.display='block';await supabase.auth.signOut();btn.disabled=false;btn.textContent='Login as Student';return}
if(['admin','super_admin'].includes(profile.role)){window.location.href='/admin-dashboard.html';return}}
try{const{data:extra}=await supabase.from('student_profiles_extra').select('profile_completed').eq('student_id',data.user.id).single()
if(!extra||!extra.profile_completed){window.location.href='/profile-onboarding.html';return}}catch(e){}
window.location.href='/dashboard.html'}catch(error){e.textContent=error.message||'Login failed';e.style.display='block';btn.disabled=false;btn.textContent='Login as Student'}}
window.loginTeacher=async()=>{const u=document.getElementById('teacher-username').value.trim(),p=document.getElementById('teacher-password').value,e=document.getElementById('error-msg'),btn=document.getElementById('teacher-login-btn')
if(!u||!p){e.textContent='Enter username and password';e.style.display='block';return}
btn.disabled=true;btn.textContent='Logging in...';e.style.display='none'
try{const{data,error}=await supabase.rpc('verify_teacher_login',{p_username:u,p_password:p})
if(error)throw error
if(!data||!data.length||!data[0].id)throw new Error('Invalid credentials')
// Store only non-sensitive session data - never store password
const sessionData={id:data[0].id,full_name:data[0].full_name,username:data[0].username,subject:data[0].subject,class_organisation:data[0].class_organisation,photo_url:data[0].photo_url}
localStorage.setItem('teacher_session',JSON.stringify(sessionData))
window.location.href='/teacher-dashboard.html'}catch(error){e.textContent=error.message||'Login failed';e.style.display='block';btn.disabled=false;btn.textContent='Login as Teacher'}}
window.switchTab=function(tab){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`[data-tab="${tab}"]`).classList.add('active');document.getElementById('student-panel').style.display=tab==='student'?'block':'none';document.getElementById('teacher-panel').style.display=tab==='teacher'?'block':'none';document.getElementById('error-msg').style.display='none'}
document.getElementById('student-password').addEventListener('keypress',e=>{if(e.key==='Enter')loginStudent()})
document.getElementById('teacher-password').addEventListener('keypress',e=>{if(e.key==='Enter')loginTeacher()})
</script>
<script src="/js/smooth-scroll.js"></script>
<script src="/js/interactions.js"></script>
</body>
</html>

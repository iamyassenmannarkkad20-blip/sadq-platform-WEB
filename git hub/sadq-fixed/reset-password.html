<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SADQ</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a5632">
  <style>
    :root { --p:#8B5CF6; --pl:#7C3AED; --pd:#0f3d20; --bg:#050816; --bg2:#090D1F; --card:#10152A; --text:#F8FAFC; --muted:#94A3B8; --border:rgba(255,255,255,0.08); --danger:#EF4444; --success:#10B981; --gold:#D4AF37; --purple:#8B5CF6; --blue:#3B82F6; --r:14px; --rs:8px; --shadow:0 4px 20px rgba(0,0,0,0.4); --t:0.3s ease; --sw:240px; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg,#050816);color:var(--text,#F8FAFC);line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
    .reset-card{background:var(--sadq-card-bg);border-radius:var(--sadq-radius);padding:32px 24px;max-width:420px;width:100%;box-shadow:var(--sadq-shadow)}
    .reset-card__logo{text-align:center;margin-bottom:20px}
    .reset-card__logo-text{font-size:1.75rem;font-weight:700;color:var(--sadq-primary);text-decoration:none}
    .reset-card__sub{font-size:.875rem;color:var(--sadq-text-muted);text-align:center;margin-bottom:24px}
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:.875rem;font-weight:500;margin-bottom:6px}
    .form-input{width:100%;padding:12px 14px;border:1px solid var(--sadq-border);border-radius:var(--sadq-radius-sm);font-size:.875rem;font-family:inherit;transition:var(--sadq-transition)}
    .form-input:focus{outline:none;border-color:var(--sadq-primary);box-shadow:0 0 0 3px rgba(26,86,50,.1)}
    .form-input--error{border-color:var(--sadq-danger)}
    .form-error{font-size:.8125rem;color:var(--sadq-danger);margin-top:4px}
    .form-hint{font-size:.75rem;color:var(--sadq-text-muted);margin-top:6px}
    .password-strength{height:4px;border-radius:2px;margin-top:6px;overflow:hidden;background:var(--sadq-border)}
    .password-strength__bar{height:100%;width:0;transition:width .3s ease,background .3s ease}
    .btn{width:100%;padding:12px;border:none;border-radius:var(--sadq-radius-sm);font-size:.9375rem;font-weight:600;cursor:pointer;transition:var(--sadq-transition);display:flex;align-items:center;justify-content:center;gap:8px}
    .btn--primary{background:var(--sadq-primary);color:#fff}
    .btn--primary:hover{background:var(--sadq-primary-light)}
    .btn--primary:disabled{opacity:.6;cursor:not-allowed}
    .login-link{text-align:center;margin-top:20px;font-size:.875rem;color:var(--sadq-text-muted)}
    .login-link a{color:var(--sadq-primary);text-decoration:none;font-weight:500}
    .login-link a:hover{text-decoration:underline}
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--sadq-radius-sm);color:#fff;font-size:.875rem;z-index:300;opacity:0;transform:translateY(10px);transition:var(--sadq-transition);max-width:350px}
    .toast--show{opacity:1;transform:translateY(0)}
    .toast--success{background:var(--sadq-success)}
    .toast--error{background:var(--sadq-danger)}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .hidden{display:none!important}
    .success-state{text-align:center;padding:20px 0}
    .success-state__icon{font-size:3rem;margin-bottom:12px}
    .success-state__title{font-size:1.125rem;font-weight:600;margin-bottom:8px;color:var(--sadq-success)}
    .success-state__text{font-size:.875rem;color:var(--sadq-text-muted)}
  </style>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>

  <div class="reset-card">
    <div class="reset-card__logo">
      <a href="/" class="reset-card__logo-text">SADQ</a>
    </div>

    <!-- Reset Form -->
    <div id="reset-form">
      <div class="reset-card__sub">Enter your new password</div>

      <form id="reset-form-el" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="new-password">New Password *</label>
          <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
          <div class="password-strength"><div class="password-strength__bar" id="strength-bar"></div></div>
          <div class="form-error hidden" id="password-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password *</label>
          <input type="password" id="confirm-password" class="form-input" placeholder="Re-enter password" required autocomplete="new-password">
          <div class="form-error hidden" id="confirm-error"></div>
        </div>

        <div class="form-error hidden" id="reset-error"></div>

        <button type="submit" class="btn btn--primary" id="reset-btn">Update Password</button>
      </form>

      <div class="login-link">
        <a href="/login.html">← Back to Login</a>
      </div>
    </div>

    <!-- Success State -->
    <div id="success-state" class="hidden success-state">
      <div class="success-state__icon">✅</div>
      <div class="success-state__title">Password Updated!</div>
      <div class="success-state__text">Your password has been changed successfully. You can now login with your new password.</div>
      <a href="/login.html" class="btn btn--primary" style="margin-top:20px;text-decoration:none">Go to Login</a>
    </div>

    <!-- Error State (invalid/expired link) -->
    <div id="error-state" class="hidden success-state">
      <div class="success-state__icon" style="opacity:.3">⚠️</div>
      <div class="success-state__title" style="color:var(--sadq-danger)">Link Expired</div>
      <div class="success-state__text">This password reset link is invalid or has expired. Please request a new one.</div>
      <a href="/login.html" class="btn btn--primary" style="margin-top:20px;text-decoration:none">Back to Login</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { supabase } from '/js/supabase-client.js';

    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = `toast toast--${type} toast--show`;
      setTimeout(() => t.classList.remove('toast--show'), 4000);
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg; el.classList.remove('hidden');
    }
    function hideError(id) { document.getElementById(id).classList.add('hidden'); }

    // Password strength meter
    document.getElementById('new-password').addEventListener('input', (e) => {
      const pwd = e.target.value;
      const bar = document.getElementById('strength-bar');
      let strength = 0;
      if (pwd.length >= 6) strength += 25;
      if (pwd.length >= 10) strength += 25;
      if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) strength += 25;
      if (/[0-9]/.test(pwd) || /[^A-Za-z0-9]/.test(pwd)) strength += 25;
      bar.style.width = strength + '%';
      bar.style.background = strength < 50 ? '#dc3545' : strength < 75 ? '#ffc107' : '#28a745';
    });

    // Check if we have a valid session from the email link
    async function checkSession() {
      try {
        const { data, error } = await supabase.auth.getSession();
        if (!data.session) {
          // No session — the link might be invalid or expired
          document.getElementById('reset-form').classList.add('hidden');
          document.getElementById('error-state').classList.remove('hidden');
        }
      } catch (err) {
        console.error('[ResetPassword] Session check error:', err.message);
      }
    }

    // Wait for Supabase to process the recovery token from URL
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // Valid recovery session — show the form
        document.getElementById('reset-form').classList.remove('hidden');
        document.getElementById('error-state').classList.add('hidden');
      }
    });

    // Also check immediately
    setTimeout(checkSession, 500);

    // Handle password update
    document.getElementById('reset-btn').addEventListener('click', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const btn = document.getElementById('reset-btn');

      let hasError = false;

      if (!newPassword) { showError('password-error', 'Password is required.'); hasError = true; }
      else if (newPassword.length < 6) { showError('password-error', 'Password must be at least 6 characters.'); hasError = true; }
      else hideError('password-error');

      if (!confirmPassword) { showError('confirm-error', 'Please confirm your password.'); hasError = true; }
      else if (newPassword !== confirmPassword) { showError('confirm-error', 'Passwords do not match.'); hasError = true; }
      else hideError('confirm-error');

      if (hasError) return;

      hideError('reset-error');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Updating...';

      try {
        const { data, error } = await supabase.auth.updateUser({ password: newPassword });

        if (error) throw error;

        // Success
        document.getElementById('reset-form').classList.add('hidden');
        document.getElementById('success-state').classList.remove('hidden');
        showToast('Password updated successfully!', 'success');

      } catch (error) {
        console.error('[ResetPassword] Error:', error.message);
        showError('reset-error', error.message || 'Unable to update password. Please try again.');
      } finally {
        btn.disabled = false; btn.textContent = 'Update Password';
      }
    });

    // PWA
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
  <script src="/js/smooth-scroll.js"></script>
  <script src="/js/interactions.js"></script>
  <script src="/js/page-transition.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates — SADQ</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a5632">
  <style>
    :root { --p:#8B5CF6; --pl:#7C3AED; --pd:#0f3d20; --bg:#050816; --bg2:#090D1F; --card:#10152A; --text:#F8FAFC; --muted:#94A3B8; --border:rgba(255,255,255,0.08); --danger:#EF4444; --success:#10B981; --gold:#D4AF37; --purple:#8B5CF6; --blue:#3B82F6; --r:14px; --rs:8px; --shadow:0 4px 20px rgba(0,0,0,0.4); --t:0.3s ease; --sw:240px; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg,#050816);color:var(--text,#F8FAFC);line-height:1.6;-webkit-font-smoothing:antialiased}
    .header{position:sticky;top:0;z-index:100;height:64px;background:var(--sadq-primary);display:flex;align-items:center;padding:0 16px;box-shadow:0 2px 4px rgba(0,0,0,.1)}
    .header__logo{font-size:1.25rem;font-weight:700;color:#fff;text-decoration:none}
    .header__nav{margin-left:auto;display:flex;gap:4px}
    .header__nav a{color:rgba(255,255,255,.85);text-decoration:none;font-size:.8125rem;padding:6px 10px;border-radius:var(--sadq-radius-sm)}
    .header__nav a:hover{background:rgba(255,255,255,.1);color:#fff}
    .container{max-width:600px;margin:0 auto;padding:16px}

    /* Search */
    .search-card{background:var(--sadq-card-bg);border-radius:var(--sadq-radius);padding:24px;box-shadow:var(--sadq-shadow);margin-bottom:20px;text-align:center}
    .search-card__icon{font-size:3rem;margin-bottom:12px}
    .search-card__title{font-size:1.125rem;font-weight:600;margin-bottom:4px}
    .search-card__sub{font-size:.8125rem;color:var(--sadq-text-muted);margin-bottom:20px}
    .search-row{display:flex;gap:8px}
    .search-input{flex:1;padding:12px 16px;border:1px solid var(--sadq-border);border-radius:var(--sadq-radius-sm);font-size:.9375rem;text-transform:uppercase}
    .search-input:focus{outline:none;border-color:var(--sadq-primary);box-shadow:0 0 0 3px rgba(26,86,50,.1)}
    .btn{padding:12px 24px;border:none;border-radius:var(--sadq-radius-sm);font-size:.875rem;font-weight:600;cursor:pointer;background:var(--sadq-primary);color:#fff;transition:var(--sadq-transition)}
    .btn:hover{background:var(--sadq-primary-light)}
    .btn:disabled{opacity:.6;cursor:not-allowed}

    /* Result */
    .cert-result{background:var(--sadq-card-bg);border-radius:var(--sadq-radius);overflow:hidden;box-shadow:var(--sadq-shadow);margin-bottom:20px}
    .cert-result__header{padding:20px;text-align:center;border-bottom:1px solid var(--sadq-border)}
    .cert-result__verified{font-size:2rem;margin-bottom:8px}
    .cert-result__status{font-size:1.125rem;font-weight:700;margin-bottom:4px}
    .cert-result__status--valid{color:var(--sadq-success)}
    .cert-result__status--invalid{color:var(--sadq-danger)}
    .cert-result__body{padding:20px}
    .cert-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--sadq-border);font-size:.875rem}
    .cert-row:last-child{border-bottom:none}
    .cert-row__label{color:var(--sadq-text-muted)}
    .cert-row__value{font-weight:500}
    .cert-id{font-family:monospace;font-size:.8125rem;background:#f8f9fa;padding:2px 8px;border-radius:4px}

    /* My certificates (if logged in) */
    .section-title{font-size:1rem;font-weight:600;margin-bottom:16px}
    .cert-list{display:grid;grid-template-columns:1fr;gap:12px}
    .cert-card{display:flex;align-items:center;gap:12px;padding:16px;background:var(--sadq-card-bg);border-radius:var(--sadq-radius-sm);box-shadow:var(--sadq-shadow);text-decoration:none;color:var(--text,#F8FAFC);transition:var(--sadq-transition)}
    .cert-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
    .cert-card__icon{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex-shrink:0;background:linear-gradient(135deg,var(--sadq-primary),var(--sadq-primary-light));color:#fff}
    .cert-card__body{flex:1;min-width:0}
    .cert-card__title{font-size:.875rem;font-weight:500;margin-bottom:2px}
    .cert-card__id{font-size:.75rem;color:var(--sadq-text-muted);font-family:monospace}
    .cert-card__date{font-size:.75rem;color:var(--sadq-text-muted)}

    .empty-state{text-align:center;padding:40px 16px;color:var(--sadq-text-muted)}
    .empty-state__icon{font-size:2.5rem;opacity:.3;margin-bottom:8px}
    .skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:sk 1.5s infinite;border-radius:var(--sadq-radius)}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .fade-in{animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .hidden{display:none!important}
    .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
</head>
<body>
  <header class="header">
    <a href="/" class="header__logo">SADQ</a>
    <nav class="header__nav">
      <a href="/explore.html">Explore</a>
      <a href="/login.html">Login</a>
    </nav>
  </header>
  <div class="container">
    <!-- Verify Certificate -->
    <div class="search-card">
      <div class="search-card__icon">📜</div>
      <div class="search-card__title">Certificate Verification</div>
      <div class="search-card__sub">Enter a certificate ID to verify its authenticity</div>
      <div class="search-row">
        <input type="text" class="search-input" id="cert-id-input" placeholder="SADQ-XXXX-XXXX">
        <button class="btn" id="verify-btn" onclick="window.verifyCert()">Verify</button>
      </div>
    </div>

    <!-- Verification result -->
    <div id="cert-result" class="hidden"></div>

    <!-- My certificates -->
    <div id="my-certs-section" class="hidden">
      <h2 class="section-title" style="margin-top:32px">📜 My Certificates</h2>
      <div id="my-certs-loading">
        <div class="skeleton" style="height:72px;margin-bottom:12px"></div>
        <div class="skeleton" style="height:72px;margin-bottom:12px"></div>
      </div>
      <div id="my-certs-list" class="cert-list hidden"></div>
      <div id="my-certs-empty" class="empty-state hidden">
        <div class="empty-state__icon">📜</div>
        <p>You don't have any certificates yet.</p>
      </div>
    </div>
  </div>
  <script type="module">
    import { supabase, getCurrentUser } from '/js/supabase-client.js';
    let currentUser=null;

    async function init(){
      try{
        const{user}=await getCurrentUser();currentUser=user;
        if(user){
          document.getElementById('my-certs-section').classList.remove('hidden');
          await loadMyCerts();
        }
      }catch{}

      // Check URL params for pre-filled cert ID
      const params=new URLSearchParams(window.location.search);
      const certId=params.get('id');
      if(certId){
        document.getElementById('cert-id-input').value=certId.toUpperCase();
        window.verifyCert();
      }
    }

    window.verifyCert=async function(){
      const certId=document.getElementById('cert-id-input').value.trim();
      const btn=document.getElementById('verify-btn');
      if(!certId){alert('Please enter a certificate ID.');return;}
      btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Verifying...';

      try{
        const{data,error}=await supabase.from('certificates')
          .select('id,certificate_id,title,recipient_name,issue_date,expiry_date,status,description,issued_by')
          .eq('certificate_id',certId.toUpperCase())
          .single();

        const resultEl=document.getElementById('cert-result');

        if(error||!data){
          resultEl.innerHTML=`
            <div class="cert-result fade-in">
              <div class="cert-result__header">
                <div class="cert-result__verified">❌</div>
                <div class="cert-result__status cert-result__status--invalid">Certificate Not Found</div>
                <div style="font-size:.8125rem;color:var(--sadq-text-muted)">No certificate exists with ID: <span class="cert-id">${certId.toUpperCase()}</span></div>
              </div>
            </div>`;
          resultEl.classList.remove('hidden');
          return;
        }

        const isValid=data.status==='active'&&(!data.expiry_date||new Date(data.expiry_date)>new Date());
        resultEl.innerHTML=`
          <div class="cert-result fade-in">
            <div class="cert-result__header">
              <div class="cert-result__verified">${isValid?'✅':'⚠️'}</div>
              <div class="cert-result__status cert-result__status--${isValid?'valid':'invalid'}">${isValid?'Verified':'Invalid'}</div>
              <div style="font-size:.8125rem;color:var(--sadq-text-muted)">${isValid?'This certificate is authentic and valid.':'This certificate is no longer valid.'}</div>
            </div>
            <div class="cert-result__body">
              <div class="cert-row"><span class="cert-row__label">Certificate ID</span><span class="cert-row__value cert-id">${data.certificate_id}</span></div>
              <div class="cert-row"><span class="cert-row__label">Title</span><span class="cert-row__value">${data.title}</span></div>
              <div class="cert-row"><span class="cert-row__label">Recipient</span><span class="cert-row__value">${data.recipient_name}</span></div>
              <div class="cert-row"><span class="cert-row__label">Issue Date</span><span class="cert-row__value">${data.issue_date?new Date(data.issue_date).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):'—'}</span></div>
              ${data.expiry_date?`<div class="cert-row"><span class="cert-row__label">Expiry Date</span><span class="cert-row__value">${new Date(data.expiry_date).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})}</span></div>`:''}
              <div class="cert-row"><span class="cert-row__label">Status</span><span class="cert-row__value">${data.status}</span></div>
              ${data.issued_by?`<div class="cert-row"><span class="cert-row__label">Issued By</span><span class="cert-row__value">${data.issued_by}</span></div>`:''}
              ${data.description?`<div class="cert-row"><span class="cert-row__label">Description</span><span class="cert-row__value">${data.description}</span></div>`:''}
            </div>
          </div>`;
        resultEl.classList.remove('hidden');
      }catch(err){
        console.error('[VerifyCert] Error:',err.message);
        const resultEl=document.getElementById('cert-result');
        resultEl.innerHTML=`
          <div class="cert-result fade-in">
            <div class="cert-result__header">
              <div class="cert-result__verified">❌</div>
              <div class="cert-result__status cert-result__status--invalid">Not Found</div>
              <div style="font-size:.8125rem;color:var(--sadq-text-muted)">No certificate found with ID: <span class="cert-id">${certId.toUpperCase()}</span></div>
            </div>
          </div>`;
        resultEl.classList.remove('hidden');
      }finally{btn.disabled=false;btn.textContent='Verify';}
    };

    async function loadMyCerts(){
      try{
        const{data,error}=await supabase.from('certificates')
          .select('id,certificate_id,title,issue_date,expiry_date,status')
          .eq('user_id',currentUser.id)
          .order('issue_date',{ascending:false});
        if(error)throw error;

        document.getElementById('my-certs-loading').classList.add('hidden');
        if(!data||data.length===0){
          document.getElementById('my-certs-empty').classList.remove('hidden');
          return;
        }

        document.getElementById('my-certs-list').innerHTML=data.map(c=>{
          const isValid=c.status==='active'&&(!c.expiry_date||new Date(c.expiry_date)>new Date());
          return `
            <a href="/certificates.html?id=${c.certificate_id}" class="cert-card fade-in">
              <div class="cert-card__icon">${isValid?'📜':'⚠️'}</div>
              <div class="cert-card__body">
                <div class="cert-card__title">${c.title}</div>
                <div class="cert-card__id">${c.certificate_id}</div>
              </div>
              <div class="cert-card__date">${c.issue_date?new Date(c.issue_date).toLocaleDateString('en-IN',{month:'short',year:'numeric'}):''}</div>
            </a>`;
        }).join('');
        document.getElementById('my-certs-list').classList.remove('hidden');
      }catch(err){
        console.error('[MyCerts] Error:',err.message);
        document.getElementById('my-certs-loading').classList.add('hidden');
        document.getElementById('my-certs-empty').classList.remove('hidden');
      }
    }

    init();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  </script>
  <script src="/js/smooth-scroll.js"></script>
  <script src="/js/interactions.js"></script>
  <script src="/js/page-transition.js"></script>
</body>
</html>
